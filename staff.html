<!DOCTYPE html>
<html lang="en" id="htmlRoot" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remal Staff - Laundry OS</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#DCA773">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/css/premium-effects.css">

    <style>
        /* =========================================
           C'EST ICI QU'ON CACHE LES TRUCS ADMIN
           ========================================= */
        
        /* 1. On cache tous les éléments marqués data-admin-only */
        [data-admin-only="true"] { 
            display: none !important; 
        }

        /* 2. On cache spécifiquement les boutons PC pour ne garder que le menu 3 points */
        .desktop-only-flex { display: none !important; }
        .mobile-only-menu { display: block !important; }

        /* 3. On garde le design original intact pour le reste */
        /* (Tout le CSS de ton index.html est repris ici) */
        
        .app-layout { display: flex; height: 100vh; overflow: hidden; position: relative; }
        
        .app-sidebar {
            width: 280px; background-color: #181614; border-right: 1px solid #2f2820;
            display: flex; flex-direction: column; flex-shrink: 0;
            position: fixed; left: 0; top: 0; bottom: 0;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .app-sidebar.open { transform: translateX(0); }

        .sidebar-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 18px; margin: 4px 12px;
            border-radius: 12px; color: #a8a29e; font-weight: 600; font-size: 13px;
            text-decoration: none; transition: all 0.3s ease;
        }
        .sidebar-link:hover { background-color: #2f2820; color: #DCA773; transform: translateX(5px); }
        .sidebar-link.active { background: linear-gradient(90deg, #DCA773, #c89360); color: #0f0e0c; font-weight: 800; box-shadow: 0 4px 15px rgba(220, 167, 115, 0.3); }
        .sidebar-link i { width: 22px; text-align: center; font-size: 15px; }

        .app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; width: 100%; }
        .app-topbar {
            height: 70px; background-color: rgba(24, 22, 20, 0.8); backdrop-filter: blur(12px);
            border-bottom: 1px solid #2f2820;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; flex-shrink: 0; z-index: 50;
            position: sticky; top: 0;
        }
        
        .app-content { flex: 1; overflow-y: auto; padding: 30px; background-color: #0f0e0c; scroll-behavior: smooth; }
        
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .sidebar-overlay.visible { opacity: 1; pointer-events: auto; }

        .header-action-btn { 
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 12px; 
            background-color: #0f0e0c; border: 1px solid #2f2820; 
            color: #a8a29e; transition: all 0.2s; cursor: pointer;
        }
        .header-action-btn:hover { color: #DCA773; border-color: #DCA773; background-color: #181614; }

        .quick-actions-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
        @media (min-width: 768px) { .quick-actions-grid { grid-template-columns: repeat(3, 1fr); } }
        .quick-action-card {
            padding: 16px; display: flex; align-items: center; gap: 16px; 
            border-radius: 16px; background: #181614; border: 1px solid #2f2820;
            text-align: left; cursor: pointer; transition: all 0.3s ease;
        }
        .quick-action-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(220, 167, 115, 0.1); border-color: rgba(220, 167, 115, 0.4); }
        .quick-action-icon { width: 44px; height: 44px; font-size: 18px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #DCA773; color: #0f0e0c; }
        .quick-action-label { font-size: 15px; font-weight: 700; margin-bottom: 2px; color: #fff; }
        .quick-action-sub { font-size: 11px; color: #a8a29e; }

        .status-dropdown { position: relative; display: inline-block; }
        .status-menu {
            position: absolute; top: 100%; right: 0; margin-top: 8px;
            background-color: #181614; border: 1px solid #2f2820; border-radius: 16px;
            padding: 8px; display: flex; flex-direction: column; gap: 6px;
            min-width: 160px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 50;
        }
        .status-dropdown:hover .status-menu, .status-dropdown:focus-within .status-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        
        .status-menu-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            border-radius: 10px; font-size: 12px; font-weight: 700; text-decoration: none;
            transition: all 0.2s; cursor: pointer; border: none; width: 100%; text-align: left;
        }
        .status-menu-item:hover { transform: translateX(4px); }
        .s-collected { color: #DCA773; background: rgba(220, 167, 115, 0.1); }
        .s-washing { color: #60a5fa; background: rgba(59, 130, 246, 0.1); }
        .s-ready { color: #34d399; background: rgba(16, 185, 129, 0.1); }
        .s-delivered { color: #a78bfa; background: rgba(139, 92, 246, 0.1); }

        body.light-mode { background-color: #f3f4f6 !important; color: #1f2937 !important; }
        body.light-mode .app-topbar { background-color: rgba(255,255,255,0.9) !important; border-bottom: 1px solid #e5e7eb !important; }
        body.light-mode .app-sidebar { background-color: #ffffff !important; border-right: 1px solid #e5e7eb !important; }
        body.light-mode .app-content { background-color: #f3f4f6 !important; }
        body.light-mode .remal-card, body.light-mode .quick-action-card, body.light-mode #sectionLiveRecord > div:first-child, body.light-mode #liveOrdersList > div { background-color: #ffffff !important; border-color: #e5e7eb !important; color: #1f2937 !important; }
        body.light-mode .text-stone-200, body.light-mode .text-stone-300, body.light-mode .text-stone-400 { color: #4b5563 !important; }
        body.light-mode .header-action-btn { background-color: #ffffff !important; border-color: #e5e7eb !important; color: #4b5563 !important; }
        body.light-mode .sidebar-link { color: #4b5563 !important; }
        body.light-mode .sidebar-link:hover, body.light-mode .sidebar-link.active { color: #DCA773 !important; background-color: #fef3c7 !important; }
        body.light-mode .status-menu { background-color: #ffffff !important; border-color: #e5e7eb !important; }

        @media print {
            body.printing-linen > *:not(#linenPrintModal) { display: none !important; }
            body.printing-linen #linenPrintModal { position: static !important; background: white !important; padding: 0 !important; display: block !important; overflow: visible !important; }
            body.printing-linen #linenPrintModal .flex-shrink-0 { display: none !important; }
            body.printing-linen #linenPrintArea { width: 100% !important; max-width: 100% !important; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="min-h-screen bg-[#12100e] text-stone-200" id="bodyRoot">

<!-- ═══ APP LAYOUT ═══ -->
<div class="app-layout">

    <!-- ═══ SIDEBAR ═══ -->
    <aside id="appSidebar" class="app-sidebar">
        <div class="p-6 border-b border-[#2f2820] flex items-center gap-3 cursor-pointer" onclick="switchMainSection('liveRecord'); toggleAppSidebar();">
            <img src="assets/remal-logo.png" alt="Remal" class="h-10 w-auto object-contain">
            <div>
                <h1 class="font-serif-luxury text-xl text-[#DCA773] font-bold tracking-widest leading-none">REMAL</h1>
                <p class="text-[10px] text-stone-400 uppercase tracking-widest mt-1">Laundry OS</p>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <a href="#" onclick="switchMainSection('liveRecord'); toggleAppSidebar();" id="navBtnLiveRecord" class="sidebar-link active">
                <i class="fas fa-bed"></i> <span>Active Rooms</span>
            </a>
            <a href="#" onclick="switchMainSection('spa'); toggleAppSidebar();" id="navBtnSpa" class="sidebar-link">
                <i class="fas fa-spa"></i> <span>SPA</span>
            </a>
            <a href="#" onclick="ouvrirModalActiveRoomsList(); toggleAppSidebar();" class="sidebar-link">
                <i class="fas fa-list-ol"></i> <span>Active Rooms List</span>
            </a>
        </nav>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleAppSidebar()"></div>

    <!-- ═══ MAIN CONTENT ═══ -->
    <div class="app-main">
        
        <header class="app-topbar no-print">
            <div class="flex items-center gap-4">
                <button onclick="toggleAppSidebar()" class="header-action-btn" title="Menu">
                    <i class="fas fa-bars text-lg"></i>
                </button>

                <div class="flex items-center gap-2 cursor-pointer" onclick="switchMainSection('liveRecord')">
                    <img src="assets/remal-logo.png" alt="Remal" class="h-8 w-auto object-contain">
                    <h1 class="font-serif-luxury text-lg text-[#DCA773] font-bold tracking-widest leading-none hidden sm:block">REMAL</h1>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Boutons Desktop (Cachés, on ne garde que le menu 3 points) -->
                <div class="desktop-only-flex items-center gap-2">
                    <button onclick="toggleTheme()" class="header-action-btn" id="themeToggleBtn" title="Toggle theme">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                </div>

                <!-- Menu 3 points -->
                <div class="mobile-only-menu relative">
                    <button onclick="document.getElementById('mobileMenuOptions').classList.toggle('hidden')" class="header-action-btn" title="Options">
                        <i class="fas fa-ellipsis-vertical"></i>
                    </button>
                    <div id="mobileMenuOptions" class="hidden absolute right-0 top-full mt-2 bg-[#181614] border border-[#2f2820] rounded-xl shadow-2xl p-2 w-40 z-[100] flex flex-col gap-1">
                        <button onclick="toggleTheme(); document.getElementById('mobileMenuOptions').classList.add('hidden');" class="flex items-center gap-3 px-3 py-2 text-xs font-bold text-stone-300 hover:bg-[#2f2820] rounded-lg">
                            <i class="fas fa-moon text-[#DCA773]"></i> Theme
                        </button>
                        <button onclick="confirmLogout()" class="flex items-center gap-3 px-3 py-2 text-xs font-bold text-rose-400 hover:bg-[#2f2820] rounded-lg">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="app-content no-print" id="appContent">
            
            <!-- QUICK ACTIONS (New Record uniquement pour le staff) -->
            <div id="quickActionButtons" class="quick-actions-grid role-admin no-print">
                <button onclick="switchMainSection('newRecord')" class="quick-action-card">
                    <div class="quick-action-icon"><i class="fas fa-plus"></i></div>
                    <div>
                        <div class="quick-action-label">New Record</div>
                        <div class="quick-action-sub">Laundry entry</div>
                    </div>
                </button>
            </div>

            <!-- On garde TOUTES les sections de ton index.html intactes -->
            <!-- (Il te suffit de copier-coller ici les sections sectionNewRecord, sectionLiveRecord, spa-laundry-section, etc.) -->
            
            <!-- Pour te simplifier la vie, je te remets la section Live Record qui est la plus importante -->
            <div id="sectionLiveRecord" class="space-y-4 no-print">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-[#181614] p-4 rounded-2xl border border-[#2f2820]">
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-bold text-stone-200 uppercase tracking-wider" id="lblActiveRoomsHeader">Active Rooms & SPA</span>
                        <span id="activeRoomsCountBadge" class="text-xs bg-[#0f0e0c] border border-[#2f2820] text-[#DCA773] font-bold px-3 py-1 rounded-full">0</span>
                    </div>

                    <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                        <button onclick="ouvrirModalActiveRoomsList()" class="flex-1 md:flex-none bg-[#0f0e0c] hover:bg-[#211e1a] text-stone-200 border border-[#2f2820] font-bold px-3 py-2 rounded-xl text-xs flex items-center justify-center gap-2 transition">
                            <i class="fas fa-list-ol text-[#DCA773]"></i>
                            <span class="hidden sm:inline">Active Rooms List</span>
                            <span class="sm:hidden">List</span>
                        </button>
                        <button onclick="switchMainSection('spa')" class="mobile-only-btn flex-1 md:flex-none bg-[#0f0e0c] hover:bg-[#211e1a] text-stone-200 border border-[#2f2820] font-bold px-3 py-2 rounded-xl text-xs items-center justify-center gap-2 transition">
                            <i class="fas fa-spa text-[#DCA773]"></i>
                            <span>SPA</span>
                        </button>
                    </div>
                </div>

                <div id="liveOrdersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-1">
                    <p class="text-xs text-stone-500 text-center py-6 col-span-full">Loading active rooms...</p>
                </div>
            </div>

            <!-- ═══ LES AUTRES SECTIONS (CACHÉES PAR DÉFAUT) ═══ -->
            <!-- J'inclus les blocs vides pour que tes scripts JS ne plantent pas -->
            <div id="sectionNewRecord" class="hidden space-y-4 no-print">
                <!-- Ton formulaire complet doit être copié ici. 
                     Pour l'exemple, je mets un placeholder. -->
                <div class="remal-card p-6 rounded-3xl relative max-w-6xl mx-auto text-center text-stone-400">
                    <p>Formulaire New Record (Copie ton code ici)</p>
                    <button onclick="switchMainSection('liveRecord')" class="text-[#DCA773] mt-4">Retour</button>
                </div>
            </div>

            <section id="spa-laundry-section" class="hidden p-6 sm:p-10 rounded-3xl space-y-6 relative max-w-4xl mx-auto printable-page bg-white text-stone-900 shadow-2xl border border-stone-200">
                <p class="text-center text-stone-500">Formulaire SPA (Copie ton code ici)</p>
                <button onclick="switchMainSection('liveRecord')" class="text-[#DCA773] mt-4 w-full text-center">Retour</button>
            </section>

        </main>
    </div>
</div>

<!-- TES SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/laundry.js"></script>
<script src="js/realtime-listener.js"></script>
<script src="js/ui-forms.js"></script>
<script src="js/ui-live.js"></script>
<script src="js/ui-modules.js"></script>
<script src="js/batch-print.js"></script>
<script src="js/checkout.js"></script>
<script src="js/stock.js"></script>
<script src="js/ui-shortcuts.js"></script>
<script src="js/sound-alerts.js"></script>
<script src="js/chat-admin.js"></script>
<script src="js/linen.js"></script>
<script src="js/guesthub-integration.js"></script>
<script src="js/ui-core.js"></script> 

<script>
    // Le script d'initialisation
    setTimeout(() => {
        if (typeof initApp === 'function') initApp();
    }, 500);
</script>

</body>
</html>
