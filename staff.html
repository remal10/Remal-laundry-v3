<!DOCTYPE html>
<html lang="en" id="htmlRoot" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remal Staff - Laundry OS</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#DCA773">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    
    <style>
        /* On force le mode sombre et l'adaptation mobile */
        body { background-color: #0f0e0c; color: #f3f4f6; }
        
        /* Cacher les éléments admin (au cas où) */
        [data-admin-only="true"] { display: none !important; }
        
        /* Barre supérieure fixe */
        .staff-topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: #181614; border-bottom: 1px solid #2f2820;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; z-index: 50;
        }
        
        /* Contenu principal */
        .staff-content {
            padding: 76px 16px 20px 16px; /* 60px topbar + 16px marge */
            min-height: 100vh;
        }

        /* Cartes des chambres optimisées mobile */
        .room-card {
            background: #181614; border: 1px solid #2f2820;
            border-radius: 16px; padding: 16px; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .room-header { display: flex; justify-content: space-between; align-items: center; }
        .room-title { font-family: 'Cinzel', serif; font-size: 18px; color: #DCA773; font-weight: 700; }
        .room-amount { font-size: 16px; font-weight: 800; color: #DCA773; }
        .room-guest { font-size: 11px; color: #a8a29e; }
        
        .status-badge {
            display: inline-block; padding: 4px 10px; border-radius: 9999px;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
        }
        .status-delivered { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-washing { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
        .status-ready { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        
        .btn-staff {
            width: 100%; padding: 14px; border-radius: 12px;
            font-size: 14px; font-weight: 800; display: flex; justify-content: center; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #DCA773, #c89360); color: #0f0e0c;
            border: none; cursor: pointer; transition: transform 0.1s;
        }
        .btn-staff:active { transform: scale(0.98); }
        
        .btn-secondary {
            background: #181614; border: 1px solid #2f2820; color: #DCA773;
        }

        /* Menu mobile */
        .mobile-menu {
            position: fixed; top: 60px; right: 12px; z-index: 100;
            background: #181614; border: 1px solid #2f2820; border-radius: 16px;
            padding: 8px; display: flex; flex-direction: column; gap: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); min-width: 150px;
        }
        .menu-item {
            padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 700;
            color: #f3f4f6; text-align: left; display: flex; gap: 10px; align-items: center;
        }
        .menu-item:active { background: #2f2820; }
    </style>
</head>
<body class="min-h-screen">

<!-- BARRE SUPÉRIEURE MOBILE -->
<header class="staff-topbar">
    <div class="flex items-center gap-2">
        <img src="assets/remal-logo.png" alt="Remal" class="h-8 w-auto object-contain">
        <span class="font-serif-luxury text-sm text-[#DCA773] font-bold tracking-widest hidden sm:block">REMAL</span>
    </div>
    
    <div class="flex items-center gap-2">
        <button onclick="toggleStaffMenu()" class="w-10 h-10 rounded-xl bg-[#0f0e0c] border border-[#2f2820] flex items-center justify-center text-stone-300">
            <i class="fas fa-ellipsis-vertical"></i>
        </button>
    </div>
</header>

<!-- MENU CACHÉ (3 POINTS) -->
<div id="staffMenu" class="mobile-menu hidden">
    <button onclick="toggleTheme(); toggleStaffMenu();" class="menu-item">
        <i class="fas fa-moon text-[#DCA773]"></i> Thème
    </button>
    <button onclick="confirmLogout()" class="menu-item text-rose-400">
        <i class="fas fa-sign-out-alt"></i> Déconnexion
    </button>
</div>

<!-- CONTENU PRINCIPAL -->
<main class="staff-content">
    
    <!-- En-tête de section -->
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-lg font-bold text-white">Active Rooms & SPA</h1>
        <span id="activeRoomsCountBadge" class="text-xs bg-[#181614] border border-[#2f2820] text-[#DCA773] font-bold px-3 py-1 rounded-full">0</span>
    </div>

    <!-- Boutons rapides Staff -->
    <div class="grid grid-cols-2 gap-2 mb-6">
        <button onclick="switchMainSection('newRecord')" class="btn-staff">
            <i class="fas fa-plus"></i> New Record
        </button>
        <button onclick="switchMainSection('spa')" class="btn-staff btn-secondary">
            <i class="fas fa-spa"></i> SPA
        </button>
    </div>

    <!-- SECTION : NEW RECORD (Cachée par défaut) -->
    <div id="sectionNewRecord" class="hidden">
        <!-- On garde tes formulaires existants ici ou on les recharge via JS -->
        <p class="text-sm text-stone-400 text-center py-4">Le formulaire New Record s'affiche ici</p>
    </div>

    <!-- SECTION : LIVE RECORD (Liste des chambres) -->
    <div id="sectionLiveRecord" class="space-y-3">
        <!-- Les chambres s'afficheront ici -->
        <div id="liveOrdersList">
            <p class="text-xs text-stone-500 text-center py-6">Loading active rooms...</p>
        </div>
    </div>

    <!-- SECTION : SPA (Cachée par défaut) -->
    <div id="spa-laundry-section" class="hidden">
        <p class="text-sm text-stone-400 text-center py-4">Le formulaire SPA s'affiche ici</p>
    </div>

</main>

<!-- TES SCRIPTS EXISTANTS (Pour que tout fonctionne) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/laundry.js"></script>
<script src="js/realtime-listener.js"></script>
<script src="js/ui-forms.js"></script>
<script src="js/ui-live.js"></script>
<script src="js/ui-modules.js"></script>
<script src="js/batch-print.js"></script>
<script src="js/checkout.js"></script>
<script src="js/stock.js"></script>
<script src="js/ui-shortcuts.js"></script>
<script src="js/sound-alerts.js"></script>
<script src="js/chat-admin.js"></script>
<script src="js/linen.js"></script>
<script src="js/guesthub-integration.js"></script>
<script src="js/ui-core.js"></script> 

<script>
    // 1. Gestion du menu 3 points
    function toggleStaffMenu() {
        const menu = document.getElementById('staffMenu');
        menu.classList.toggle('hidden');
    }

    // 2. Fonction de switch de section basique pour le staff
    function switchMainSection(section) {
        // Cacher toutes les sections
        document.getElementById('sectionLiveRecord').classList.add('hidden');
        document.getElementById('sectionNewRecord').classList.add('hidden');
        document.getElementById('spa-laundry-section').classList.add('hidden');

        // Afficher la bonne section
        if (section === 'liveRecord') document.getElementById('sectionLiveRecord').classList.remove('hidden');
        if (section === 'newRecord') document.getElementById('sectionNewRecord').classList.remove('hidden');
        if (section === 'spa') document.getElementById('spa-laundry-section').classList.remove('hidden');
    }

    // 3. Lancer l'app au chargement
    setTimeout(() => {
        if (typeof initApp === 'function') initApp();
    }, 500);
</script>

</body>
</html>
